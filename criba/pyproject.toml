[project]
name = "criba"
version = "0.1.0"
description = "Plataforma de Criba (réplica mínima de desarrollo) y módulo Criba Match"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    # pg8000 y no psycopg: esta máquina de desarrollo (Windows) bloquea el .dll de
    # libpq del binario de psycopg con una política de control de aplicaciones.
    # pg8000 es Python puro, habla el mismo protocolo y no carga librerías nativas.
    "pg8000>=1.31",
    "jinja2>=3.1",
    # Explícita desde PR-09 aunque ya venía con FastAPI: el adaptador del
    # proveedor valida con ella la **forma** de la respuesta del modelo y genera
    # de ahí el `--json-schema` que le pide al CLI. Un import directo que vive de
    # una dependencia transitiva se rompe el día que FastAPI cambie la suya.
    "pydantic>=2.9",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    # `httpx2` además de `httpx`: el TestClient de starlette 1.x avisa de que
    # usarlo con `httpx` está obsoleto. Sin esto, cada bloque de evidencia de
    # cada PR arrastra el mismo aviso y deja de leerse.
    "httpx2>=2.16",
    "ruff>=0.14",
    "poethepoet>=0.32",
    # El E2E de humo de PR-07: Chromium headless, servidor levantado por el
    # propio test. `uv sync` instala la librería, **no el navegador**: hace falta
    # `uv run python -m playwright install chromium` (en CI, con `--with-deps`).
    "pytest-playwright>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
# Sin exclusiones: las migraciones de Match también se revisan y se formatean
# (la regla (a) del test de enumeración de PR-04 también se les aplica).

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# `python -m` en las tres órdenes a propósito: la máquina de desarrollo (Windows)
# bloquea a veces los .exe de los entornos virtuales.
[tool.poe.tasks.check]
help = "ruff check + ruff format --check + pytest"
sequence = [
    { cmd = "python -m ruff check ." },
    { cmd = "python -m ruff format --check ." },
    { cmd = "python -m pytest" },
]

# El arnes de evals del fit score, **siempre con el MOCK**: no sale del proceso, no
# abre red, no gasta nada y tarda segundos. Lo que comprueba es que el camino de
# produccion funciona de punta a punta, no la calidad del modelo (el MOCK devuelve
# un score fijo). La calidad se mide a mano con `--proveedor claude`, que cuesta
# dinero: la CI no lo corre (`docs/arquitectura.md` §2, D12) y por eso esta tarea no
# entra en `check`. Como correrlo con el modelo real esta en `evals/README.md`.
[tool.poe.tasks.evals]
help = "arnes de evals del fit score con el proveedor MOCK (sin red, sin costo)"
cmd = "python -m evals --proveedor mock --k 3"

# --- el staging local con la configuracion de produccion --------------------
#
# Cinco tareas, en el orden en que se corren (el orden completo, con lo que hay
# que mirar en cada paso, esta en `RUNBOOK.md`):
#
#   poe staging-arriba     levanta el contenedor y migra con el rol dueno
#   poe staging-sembrar    datos sinteticos de `app/plataforma/semilla.py`
#   poe staging-app        el proceso web, en el 8001
#   poe staging-ejecutor   el proceso del ejecutor (ADR-001: en produccion va dentro del web)
#   poe staging-humo       el E2E de humo contra el staging ya levantado
#
# **Quien corre cada cosa.** Las dos primeras van con `CRIBA_URL_BD` del **dueno**
# de la base, puesta aqui mismo: migrar es DDL y sembrar hace
# `TRUNCATE ... RESTART IDENTITY`, y `criba_app` no puede ni debe poder hacer
# ninguna de las dos (`staging/roles.sql`). Las tres ultimas van con
# `staging/staging.env`, que trae la URL de `criba_app` y la configuracion de
# produccion. Esa separacion es la mitad del ejercicio: si una tarea de la app
# necesitara la URL del dueno, el staging no estaria probando lo que dice probar.
#
# La contrasena del dueno es un valor de una maquina local, igual que la de
# `docker-compose.staging.yml` y las de `staging/roles.sql`. No es un secreto de
# produccion (F19).
[tool.poe.tasks.staging-arriba]
help = "levanta el Postgres del staging (5455) y lo migra con el rol dueno"
sequence = [
    { cmd = "docker compose -f docker-compose.staging.yml up -d --wait" },
    { cmd = "python -m alembic upgrade head" },
]
env = { CRIBA_URL_BD = "postgresql+pg8000://criba:criba@localhost:5455/criba_staging" }

[tool.poe.tasks.staging-sembrar]
help = "siembra el staging con los datos sinteticos de la semilla (rol dueno)"
cmd = "python -m app.plataforma.semilla"
env = { CRIBA_URL_BD = "postgresql+pg8000://criba:criba@localhost:5455/criba_staging" }

[tool.poe.tasks.staging-app]
help = "la app del staging en el 8001, con la configuracion de produccion"
cmd = "uv run --env-file staging/staging.env python -m uvicorn app.main:app --port 8001"

[tool.poe.tasks.staging-ejecutor]
help = "el ejecutor como proceso aparte del staging (pasadas en bucle, Ctrl+C para parar)"
cmd = "uv run --env-file staging/staging.env python -m app.match.comandos.ejecutor"

[tool.poe.tasks.staging-humo]
help = "el E2E de humo contra el staging levantado (sin CRIBA_URL_STAGING se salta)"
cmd = "uv run --env-file staging/staging.env python -m pytest tests/staging/test_humo_staging.py"
